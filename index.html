function getSupabase(){if(!supabaseClient&&window.supabase){supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}return supabaseClient}
async function initCloud(){
 const sb=getSupabase();if(!sb)return;
 const {data}=await sb.auth.getSession();currentSession=data.session||null;
 sb.auth.onAuthStateChange(async(_event,session)=>{currentSession=session||null;cloudReady=false;if(session)await prepareCloudSession();else renderCloudStatus()});
 if(currentSession)await prepareCloudSession();else renderCloudStatus()
}
function cloudUser(){return currentSession&&currentSession.user?currentSession.user:null}
function cloudMarkerKey(){const u=cloudUser();return u?'hf_cloud_sync_'+u.id:''}
function setCloudMarker(ts){const k=cloudMarkerKey();if(k&&ts)localStorage.setItem(k,ts)}
function getCloudMarker(){const k=cloudMarkerKey();return k?localStorage.getItem(k):null}
function hasMeaningfulLocalData(){return ['assets','incomes','expenses','goals'].some(k=>Array.isArray(db[k])&&db[k].length>0)}
function publicRedirectUrl(){return window.location.origin+window.location.pathname}
async function signInGoogle(){const sb=getSupabase();if(!sb)return alert(t('Supabase not loaded'));await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:publicRedirectUrl()}})}
async function signOutCloud(){const sb=getSupabase();if(!sb)return;clearTimeout(cloudSaveTimer);cloudReady=false;await sb.auth.signOut();currentSession=null;renderCloudStatus()}
function cloudSafeData(){return JSON.parse(JSON.stringify(db))}
async function applyCloudRecord(record){cloudApplying=true;db=dm(DEF,record.data||{});migrate();localStorage.setItem(KEY,JSON.stringify(db));setCloudMarker(record.updated_at);cloudApplying=false;cloudReady=true;render();toast(t('Cloud data loaded.'));renderCloudStatus()}
async function prepareCloudSession(){
 const sb=getSupabase(),user=cloudUser();if(!sb||!user)return;
 const {data,error}=await sb.from('user_finance_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
 if(error){console.error(error);renderCloudStatus();return}
 if(!data){cloudReady=true;await performCloudSave(true);return}
 const marker=getCloudMarker();
 if(!marker&&hasMeaningfulLocalData()){
  if(confirm(t('Cloud data found. Load it now? Choose Cancel to keep this device’s local data without overwriting cloud.'))){await applyCloudRecord(data)}
  else{cloudReady=false;renderCloudStatus()}
  return
 }
 if(!marker||new Date(data.updated_at)>new Date(marker)){await applyCloudRecord(data);return}
 cloudReady=true;renderCloudStatus();scheduleAutoSave(250)
}
function scheduleAutoSave(delay=900){if(cloudApplying||!cloudReady||!cloudUser())return;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>performCloudSave(true),delay)}
async function performCloudSave(silent=false){
 const sb=getSupabase(),user=cloudUser();if(!sb||!user)return false;
 if(cloudSaveInFlight){cloudSaveQueued=true;return false}
 cloudSaveInFlight=true;
 const timestamp=new Date().toISOString();
 const payload={user_id:user.id,data:cloudSafeData(),updated_at:timestamp};
 const {error}=await sb.from('user_finance_data').upsert(payload,{onConflict:'user_id'});
 cloudSaveInFlight=false;
 if(error){console.error(error);if(!silent)alert(error.message);renderCloudStatus();return false}
 cloudReady=true;setCloudMarker(timestamp);if(!silent)toast(t('Cloud save completed.'));renderCloudStatus();

function field(id,label,type='text',val='',opts=null,wide=false,labeler=x=>x){let control=opts?`<select id="${id}">${opt(opts,val,labeler)}</select>`:type==='textarea'?`<textarea id="${id}">${esc(val)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(val)}">`;return `<div class="${wide?'wide':''}"><label>${t(label)}</label>${control}</div>`}function subOptions(cat,sel){return db.subcategories.filter(s=>s.category===cat).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(t(s.name))}</option>`).join('')}function openEntity(kind,rid=null){let arr=kind==='asset'?db.assets:kind==='income'?db.incomes:kind==='expense'?db.expenses:kind==='goal'?db.goals:[],r=rid?arr.find(x=>x.id===rid):null,curs=Object.keys(db.rates).sort(),body='',title='';if(kind==='asset'){title=rid?t('Edit net worth item'):t('Add net worth item');body=field('m_name','Name','text',r?.name||'',null,true)+field('m_owner','Owner','text',r?.owner||'Commun',db.people)+field('m_type','Type','text',r?.type||db.assetTypes[0],db.assetTypes,false,x=>t(x))+field('m_currency','Currency','text',r?.currency||db.baseCurrency,curs)+field('m_amount','Amount','number',r?.amount||'')+field('m_comment','Comment','textarea',r?.comment||'',null,true)}if(kind==='income'){title=rid?t('Edit income'):t('Add income');body=field('m_name','Description','text',r?.name||'',null,true)+field('m_owner','Person','text',r?.owner||'Commun',db.people)+field('m_amount','Amount','number',r?.amount||'')+field('m_currency','Currency','text',r?.currency||db.baseCurrency,curs)+field('m_period','Frequency','text',r?.period||'monthly',PERIODS.map(p=>p.id),false,x=>t(PERIODS.find(p=>p.id===x)?.label||x))}if(kind==='expense'){let cat=r?.category||'need';title=rid?t('Edit expense'):t('Add expense');body=field('m_name','Description','text',r?.name||'',null,true)+field('m_owner','Person','text',r?.owner||'Commun',db.people)+field('m_category','Category','text',cat,CATS.map(c=>c.id),false,x=>t(CATS.find(c=>c.id===x)?.label||x))+`<div><label>${t('Subcategory')}</label><select id="m_subcategory">${subOptions(cat,r?.subcategory||firstSub(cat))}</select></div>`+field('m_amount','Amount','number',r?.amount||'')+field('m_currency','Currency','text',r?.currency||db.baseCurrency,curs)+field('m_period','Frequency','text',r?.period||'monthly',PERIODS.map(p=>p.id),false,x=>t(PERIODS.find(p=>p.id===x)?.label||x))+field('m_comment','Comment','textarea',r?.comment||'',null,true)}if(kind==='goal'){title=rid?t('Edit goal'):t('Add goal');body=field('m_name','Description','text',r?.name||'',null,true)+field('m_target','Target amount','number',r?.target||'')+field('m_current','Current amount','number',r?.current||'')+field('m_currency','Currency','text',r?.currency||db.baseCurrency,curs)}modalOpen('entity',title,`<div class="form">${body}</div>`);setTimeout(()=>{const catEl=document.getElementById('m_category');const subEl=document.getElementById('m_subcategory');if(catEl&&subEl){catEl.onchange=()=>{subEl.innerHTML=subOptions(catEl.value,firstSub(catEl.value));};}const saveBtn=document.getElementById('modalSave');if(saveBtn){saveBtn.onclick=()=>saveEntity(kind,rid);}},0)}function saveEntity(kind,rid){let arr=kind==='asset'?db.assets:kind==='income'?db.incomes:kind==='expense'?db.expenses:db.goals,r=rid?arr.find(x=>x.id===rid):{id:id()};if(kind==='asset')Object.assign(r,{name:$('m_name').value.trim(),owner:$('m_owner').value,type:$('m_type').value,currency:$('m_currency').value,amount:+$('m_amount').value||0,comment:$('m_comment').value.trim()});if(kind==='income')Object.assign(r,{name:$('m_name').value.trim(),owner:$('m_owner').value,amount:+$('m_amount').value||0,currency:$('m_currency').value,period:$('m_period').value});if(kind==='expense')Object.assign(r,{name:$('m_name').value.trim(),owner:$('m_owner').value,category:$('m_category').value,subcategory:$('m_subcategory').value,amount:+$('m_amount').value||0,currency:$('m_currency').value,period:$('m_period').value,comment:$('m_comment').value.trim()});if(ki function net(){let a=0,d=0;db.assets.forEach(x=>{let v=toBase(x.amount,x.currency);if(typeKind(x.type)==='liability'||v<0)d+=Math.abs(v);else a+=v});return{assets:a,debts:d,net:a-d}}function filteredAssets(){return db.assets.filter(a=>(db.filters.owner==='Tous'||a.owner===db.filters.owner)&&(db.filters.type==='Tous'||a.type===db.filters.type))}function assetItem(a){let v=toBase(a.amount,a.currency),debt=typeKind(a.type)==='liability'||v<0;return `<div class="item"><div class="itemrow"><div><div class="ititle">${esc(a.name)}</div><div class="isub">${esc(a.owner)}</div></div><div class="amount ${debt?'red':'green'}">${money(v)}</div>${menu('asset',a.id,true)}</div></div>`}function rowItem(r,type){let isGoal=type==='goal',m=!isGoal?monBase(r):0,sub=!isGoal?`${t(PERIODS.find(p=>p.id===r.period)?.label||'Monthly')} · ${esc(r.owner||'Commun')}${type==='expense'?' · '+esc(subName(r.subcategory)):''}`:`${money(r.current,r.currency)} / ${money(r.target,r.currency)}`,val=isGoal?Math.min((r.current||0)/(r.target||1)*100,100).toFixed(0)+'%':`${money(m)}/${t('Monthly').toLowerCase()}`,cls=isGoal?goalClass(r):'';return `<div class="item ${cls} ${type==='expense'?'expense-item':''}"><div class="itemrow"><div><div class="ititle">${esc(r.name)}</div><div class="isub">${sub}</div></div><div class="amount">${val}</div>${menu(type,r.id,type==='expense')}</div>${isGoal?goalBar(r):''}</div>`}function groupedAssets(list){let out='';db.assetTypes.forEach(type=>{let arr=list.filter(a=>a.type===type).sort((a,b)=>Math.abs(toBase(b.amount,b.currency))-Math.abs(toBase(a.amount,a.currency)));if(arr.length){let subtotal=arr.reduce((sum,a)=>sum+toBase(a.amount,a.currency),0);out+=`<div class="grp between" style="align-items:baseline"><span>${t(type)}</span><span class="muted" style="font-size:12px;text-transform:none;letter-spacing:0">${money(subtotal)}</span></div>`+arr.map(assetItem).join('')}});return out}function groupedIncomes(){let out='';db.people.forEach(p=>{let arr=db.incomes.filter(x=>x.owner===p).sort((a,b)=>monBase(b)-monBase(a));if(arr.length){let subtotal=arr.reduce((s,x)=>s+monBase(x),0);out+=`<div class="grp between" style="align-items:baseline"><span>${esc(p)}</span><span class="muted" style="font-size:12px;text-transform:none;letter-spacing:0">${money(subtotal)}/${t('Monthly').toLowerCase()}</span></div>`+arr.map(x=>rowItem(x,'income')).join('')}});return out}function groupedExpenses(){let out='';CATS.forEach(c=>{let arr=db.expenses.filter(e=>e.category===c.id);if(!arr.length)return;let catTotal=arr.reduce((s,e)=>s+monBase(e),0);out+=`<div class="grp budget-cat between"><span>${c.emoji} ${t(c.label)}</span><span class="muted" style="font-size:12px;text-transform:none;letter-spacing:0">${money(catTotal)}/${t('Monthly').toLowerCase()}</span></div>`;db.subcategories.filter(s=>s.category===c.id).forEach(sc=>{let sub=arr.filter(e=>e.subcategory===sc.id).sort((a,b)=>monBase(b)-monBase(a));if(sub.length){let subTotal=sub.reduce((sum,e)=>sum+monBase(e),0);out+=`<div class="budget-sub"><span>${t(sc.name)}</span><span>${money(subTotal)}/${t('Monthly').toLowerCase()}</span></div>`+sub.map(e=>rowItem(e,'expense')).join('')}})});return out}function goalClass(g){let p=Math.min((g.current||0)/(g.target||1)*100,100);return 'goal '+(p>=100?'done':p>=75?'near':p>=25?'progress':'start')}function goalBar(g){let p=Math.min((g.current||0)/(g.target||1)*100,100),rest=Math.max((g.target||0)-(g.current||0),0),col=p>=100?'var(--success)':p>=75?'var(--primary)':p>=25?'var(--warning)':'var(--danger)',status=p>=100?'✅ '+t('Reached'):p>=75?'🔵 '+t('Almost reached'):p>=25?'🟡 '+t('In progress'):'🔴 '+t('Started');return `<div style="margin-top:10px"><div class="bar"><span style="width:${p}%;background:${col}"></span></div><div class="between" style="margin-top:8px"><span class="topnote">${status}</span><span class="topnote">${t('Remaining')}: ${money(rest,g.currency)}</span></div></div>`}function donut(el,map){let entries=Object.entries(map).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),total=entries.reduce((s,x)=>s+x[1],0);if(!total){$(el).innerHTML='<div class="empty">'+t('No data.')+'</div>';return}let off=25,svg=`<svg width="135" height="135" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--card3)" stroke-width="7"></circle>`,leg='<div class="legend">';entries.forEach(([k,v],idx)=>{let pct=v/total*100,col=chartColor(idx);svg+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${off}"></circle>`;off=(off-pct+100)%100;leg+=`<div class="leg"><span class="dot" style="background:${col}"></span>${t(k)} · <b>${pct.toFixed(0)}%</b></div>`});$(el).innerHTML=svg+'</svg>'+leg+'</div>'}function renderFilter(){modalOpen('filter',t('Filters'),`<div class="form"><div><label>${t('Person')}</label><select id="filterOwner">${opt(['Tous',...db.people],db.filters.owner,x=>x==='Tous'?'All':x)}</select></div><div><label>${t('Type')}</label><select id="filterType">${opt(['Tous',...db.assetTypes],db.filters.type,x=>x==='Tous'?'All':t(x))}</select></div></div><div class="actions" style="margin-top:12px"><button class="btn secondary" id="filterReset" type="button">${t('Reset')}</button></div>`);setTimeout(()=>{modalSave.onclick=()=>{db.filters={owner:filterOwner.value,type:filterType.value};closeM('filterModal');persist();showPage('assets',true)};filterReset.onclick=()=>{filterOwner.value='Tous';filterType.value='Tous';db.filters={owner:'Tous',type:'Tous'};closeM('filterModal');persist();showPage('assets',true)}} ,0)}
async function refreshRatesFn(){let keep=currentPage,base=db.baseCurrency.toUpperCase(),ok=false;db.rates[base]=1;try{let res=await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(base),{cache:'no-store'}),data=await res.json();if(data.rates){Object.keys(db.rates).forEach(c=>{if(c!==base&&c!=='BTC'&&data.rates[c])db.rates[c]=1/Number(data.rates[c])});ok=true}}catch(e){console.error(e)}try{if('BTC'in db.rates){let vs=base.toLowerCase(),r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies='+vs),d=await r.json();if(d.bitcoin&&d.bitcoin[vs])db.rates.BTC=Number(d.bitcoin[vs]);ok=true}}catch(e){console.error(e)}if(ok){db.ratesMeta={source:'open.er-api + CoinGecko',updatedAt:new Date().toISOString()};persist();showPage(keep,keep!=='settings');toast('Rates updated')}else alert('Could not refresh rates. Old rates are kept.')}
function renderHistory(){if(!document.getElementById('historyVisual'))return;let h=[...db.history].sort((a,b)=>a.date.localeCompare(b.date));if(!h.length){historyVisual.innerHTML='<div class="empty">'+t('No snapshot yet. Add a snapshot to create a chart.')+'</div>';return}let last=h[h.length-1],prev=h[h.length-2],delta=prev?last.value-prev.value:0,pct=prev&&prev.value?delta/Math.abs(prev.value)*100:0,vals=h.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,pts=h.map((x,i)=>`${5+i*(90/Math.max(h.length-1,1))},${95-((x.value-min)/range)*80}`).join(' ');historyVisual.innerHTML=`<div class="stat"><div class="between"><div><div class="label">${t('Latest snapshot')}</div><div class="value">${money(last.value)}</div></div><div class="amount ${delta>=0?'green':'red'}">${prev?(delta>=0?'+':'')+money(delta)+' / '+pct.toFixed(1)+'%':'N/A'}</div></div><svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="topnote">${h[0].date} → ${last.date}</div></div>`}function renderBudgetAnalysis(income){let by={need:0,want:0,save:0};db.expenses.forEach(e=>by[e.category]=(by[e.category]||0)+monBase(e));let total=Object.values(by).reduce((s,v)=>s+v,0),left=income-total,status=left>0?t('Left to budget'):left<0?t('Over budget'):t('Fully budgeted'),statusClass=left>=0?'green':'red';let summary=`<div class="stat" style="margin-bottom:10px"><div class="between"><div><div class="label">${t('Budget status')}</div><div class="value ${statusClass}">${status}</div></div><div class="amount ${statusClass}">${money(Math.abs(left))}</div></div><div class="topnote" style="margin-top:8px">${t('Total budgeted')}: ${money(total)} · ${t('Monthly income')}: ${money(income)}</div></div>`;budgetAnalysis.innerHTML=summary+CATS.map(c=>{let target=income*(db.pct[c.id]||0)/100,actual=by[c.id]||0,ratio=target?Math.min(actual/target*100,100):0,over=actual>target&&income>0,col=c.id==='need'?'var(--danger)':c.id==='want'?'var(--warning)':'var(--success)';let difference=target-actual,diffLabel=difference>=0?t('Remaining to target'):t('Over target'),diffClass=difference>=0?'green':'red';return `<div class="stat" style="margin-bottom:10px"><div class="between"><div><div class="label">${c.emoji} ${t(c.label)}</div><div class="value">${money(actual)}</div></div><div style="text-align:right"><div class="amount ${over?'red':'green'}">${t('Target')} ${money(target)}</div><div class="topnote ${diffClass}" style="margin-top:4px">${diffLabel}: ${money(Math.abs(difference))}</div></div></div><div class="bar" style="margin-top:10px"><span style="width:${ratio}%;background:${col}"></span></div></div>`}).join('')}function renderSettings(){let curs=Object.keys(db.rates).sort();themeSelect.value=db.theme;baseCurrency.innerHTML=opt(curs,db.baseCurrency);baseCurrency.value=db.baseCurrency;lastUpdate.value=db.ratesMeta.updatedAt?new Date(db.ratesMeta.updatedAt).toLocaleString('fr-CH')+' · '+db.ratesMeta.source:'Never';pctNeed.value=db.pct.need;pctWant.value=db.pct.want;pctSave.value=db.pct.save;let sum=(+db.pct.need||0)+(+db.pct.want||0)+(+db.pct.save||0);pctStatus.textContent=sum===100?'✅ Total = 100%':`❌ Total = ${sum}%`;pctStatus.className='budget-status '+(sum===100?'ok':'bad');newSubcatCategory.innerHTML=CATS.map(c=>`<option value="${c.id}">${c.emoji} ${t(c.label)}</option>`).join('');ratesList.innerHTML=curs.filter(c=>c!==db.baseCurrency).map(c=>`<div class="item"><div class="inline-rate"><div><div class="ititle">${c}</div><div class="isub">1 ${c} = ${rate(c).toLocaleString('fr-CH',{maximumFractionDigits:c==='BTC'?0:6})} ${db.baseCurrency}</div></div>${menu('rate',c)}</div></div>`).join('')||'<div class="empty">'+t('No secondary currency.')+'</div>';peopleList.innerHTML=db.people.map(p=>`<div class="item people-bold"><div class="compact"><input style="font-weight:850" value="${esc(p)}" data-person="${esc(p)}"><div>${menu('person',p,false,true)}</div></div></div>`).join('');assetTypesList.innerHTML=db.assetTypes.map(x=>`<div class="item"><div class="asset-type-row"><div><label>${t('Type')}</label><input style="font-weight:850" value="${esc(t(x))}" data-atype="${esc(x)}"></div><div><label>${t('Classification')}</label><select data-atype-kind="${esc(x)}"><option value="asset" ${typeKind(x)==='asset'?'selected':''}>${t('Asset')}</option><option value="liability" ${typeKind(x)==='liability'?'selected':''}>${t('Liability')}</option></select></div><div>${menu('atype',x,false,true)}</div></div></div>`).join('');subcatList.innerHTML=CATS.map(c=>`<div class="grp">${c.emoji} ${t(c.label)}</div>`+db.subcategories.filter(s=>s.category===c.id).map(s=>`<div class="item"><div class="compact"><input value="${esc(t(s.name))}" data-subcat-name="${s.id}"><div>${menu('subcat',s.id,false,true)}</div></div></div>`).join('')).join('');document.querySelectorAll('[data-person]').forEach(i=>i.onchange=()=>renamePerson(i.dataset.person,i.value.trim()));document.querySelectorAll('[data-atype]').forEach(i=>i.onchange=()=>renameType(i.dataset.atype,i.value.trim()));document.querySelectorAll('[data-atype-kind]').forEach(i=>i.onchange=()=>{db.assetTypeKinds=db.assetTypeKinds||{};db.assetTypeKinds[i.dataset.atypeKind]=i.value;persist();showPage('settings',false)});document.querySelectorAll('[data-subcat-name]').forEach(i=>i.onchange=()=>{let s=db.subcategories.find(x=>x.id===i.dataset.subcatName);if(s&&i.value.trim())s.name=i.value.trim();persist();showPage('settings',false)})}function renamePerson(old,nw){if(!nw)return persist();db.people=db.people.map(x=>x===old?nw:x);['assets','incomes','expenses'].forEach(k=>db[k].forEach(x=>{if(x.owner===old)x.owner=nw}));persist();showPage('settings',false)}function renameType(old,nw){if(!nw)return persist();db.assetTypeKinds=db.assetTypeKinds||{};let kind=typeKind(old);db.assetTypes=db.assetTypes.map(x=>x===old?nw:x);db.assets.forEach(x=>{if(x.type===old)x.type=nw});delete db.assetTypeKinds[old];db.assetTypeKinds[nw]=kind;persist();showPage('settings',false)}function render(){migrate();applyTheme();renderShell();let n=net(),inc=db.incomes.reduce((s,x)=>s+monBase(x),0),exp=db.expenses.reduce((s,x)=>s+monBase(x),0),bal=inc-exp;dashNet.innerHTML=`${money(n.net).replace(' '+db.baseCurrency,'')} <small>${db.baseCurrency}</small>`;netWorth.innerHTML=dashNet.innerHTML;totalAssets.textContent=money(n.assets);totalDebts.textContent=money(n.debts);dashIncome.textContent=money(inc);dashExpense.textContent=money(exp);if(document.getElementById('incomeTotalTitle'))incomeTotalTitle.textContent='· '+money(inc)+'/'+t('Monthly').toLowerCase();if(document.getElementById('expenseTotalTitle'))expenseTotalTitle.textContent='· '+money(exp)+'/'+t('Monthly').toLowerCase();dashBalance.textContent=money(bal);dashBalance.className='value '+(bal>=0?'green':'red');monthlyBudgetTotal.innerHTML=`${money(exp).replace(' '+db.baseCurrency,'')} <small>${db.baseCurrency}/${t('Monthly').toLowerCase()}</small>`;let list=filteredAssets();activeFilters.innerHTML=`<span class="filterpill">${t('Person')}: ${esc(db.filters.owner==='Tous'?'All':db.filters.owner)}</span><span class="filterpill">${t('Type')}: ${esc(db.filters.type==='Tous'?'All':t(db.filters.type))}</span>`;assetsList.innerHTML=list.length?groupedAssets(list):'<div class="empty">'+t('No line with these filters.')+'</div>';let ownerMap={},typeMap={};list.forEach(a=>{let v=toBase(a.amount,a.currency);if(typeKind(a.type)!=='liability'&&v>0){ownerMap[a.owner]=(ownerMap[a.owner]||0)+v;typeMap[a.type]=(typeMap[a.type]||0)+v}});donut('ownerChart',ownerMap);donut('typeChart',typeMap);let allOwner={};db.assets.forEach(a=>{let v=toBase(a.amount,a.currency);allOwner[a.owner]=(allOwner[a.owner]||0)+(typeKind(a.type)==='liability'||v<0?-Math.abs(v):v)});personSplit.innerHTML=Object.entries(allOwner).map(([o,v])=>`<div class="item"><div class="itemrow"><div><div class="ititle">${esc(o)}</div><div class="isub">${t('Net worth')}</div></div><div class="amount ${v>=0?'green':'red'}">${money(v)}</div><span></span></div></div>`).join('')||'<div class="empty">'+t('No data.')+'</div>';incomeList.innerHTML=db.incomes.length?groupedIncomes():'<div class="empty">'+t('Add your income.')+'</div>';expenseList.innerHTML=db.expenses.length?groupedExpenses():'<div class="empty">'+t('Add your expenses.')+'</div>';renderBudgetAnalysis(inc);goalsList.innerHTML=db.goals.length?db.goals.map(x=>rowItem(x,'goal')).join(''):'<div class="empty">'+t('Add a goal.')+'</div>';let avg=db.goals.length?db.goals.reduce((s,g)=>s+Math.min((g.current||0)/(g.target||1)*100,100),0)/db.goals.length:0;goalAvg.innerHTML=`${avg.toFixed(0)} <small>${t('% completed')}</small>`;dashGoals.textContent=avg.toFixed(0)+'%';renderHistory();if(document.getElementById('historyList'))historyList.innerHTML=db.history.slice().reverse().map(h=>`<div class="item"><div class="itemrow"><div><div class="ititle">${h.date}</div><div class="isub">${t('Net worth snapshot')}</div></div><div class="amount">${money(h.value)}</div>${menu('history',h.id)}</div></div>`).join('')||'<div class="empty">'+t('No snapshot.')+'</div>';renderSettings()}render();initCloud();})();
